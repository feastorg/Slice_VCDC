# slice.yaml: BREAD Slice manifest, schema 2.0 (bread-infra spec/slice/slice-manifest-spec.md)
schema_version: '2.0'
id: slice-vcdc
name: DC Voltage and Current Sensor
summary: Isolated DC voltage (AMC1311) and current (ACS724) measurement slice.
category: sensing
status: development
hardware:
  hw_gen_current: 3
  interface: SI1
  pcb:
    layers: 2
    dimensions: 70mm x 100mm
    thickness: 1.6mm
  mounting:
    pattern: slice-S-v0
  mcu:
    form_factor: nano
interfaces:
  host:
    address_default: 18
metadata:
  tags:
  - power-monitoring
  - dc-voltage
  - dc-current
  - hall-effect
  - isolation
